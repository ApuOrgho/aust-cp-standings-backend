name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes — comfortably inside Render free tier's ~15 min
    # inactivity spin-down window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        # Retries ride out Render cold-start hiccups; the trailing `|| true`
        # keeps a single missed ping from spamming failure-notification
        # emails for what is just a best-effort keep-alive request.
        run: |
          curl -sS -m 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code}\n" \
            https://aust-cp-standings-backend-1.onrender.com/ || true
